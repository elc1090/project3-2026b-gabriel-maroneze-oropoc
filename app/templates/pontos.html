<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="description"
      content="Ubicación de los puntos de recogida de residuos"
    />

    <title>Puntos de Recogida | EcoAvanza</title>

    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', path='images/favicon.svg') }}"
    />

    <!-- 🎨 O tema entra em cena antes da página aparecer,
         evitando aquela piscada entre claro e escuro. -->
    <script src="{{ url_for('static', path='js/theme.js') }}"></script>
    <script src="{{ url_for('static', path='js/language.js') }}" defer></script>

    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/styles.css') }}?v=3"
    />

    <!-- 🧠 Pequeno cérebro exclusivo desta nova página. -->
    <script
      src="{{ url_for('static', path='js/pontos.js') }}"
      defer
    ></script>
  </head>

  <body class="app-page">
    <div class="app-shell">
      <aside
        class="app-sidebar"
        aria-label="Navegación principal"
      >
        <!-- 🌱 A logo também funciona como caminho de volta para casa. -->
        <a
          class="sidebar-brand"
          href="/painel#minha-empresa"
          aria-label="EcoAvanza — Mi empresa"
        >
          <img
            src="{{ url_for('static', path='images/logo-ecoavanza.png') }}"
            alt="EcoAvanza"
          />
        </a>

        <nav
          class="sidebar-nav"
          aria-label="Secciones de la aplicación"
        >
          <a
            class="sidebar-link"
            href="/painel#minha-empresa"
            data-page="Mi empresa"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"
              />
              <path d="M9 21v-7h6v7" />
            </svg>

            <span>Mi empresa</span>
          </a>

          <a
            class="sidebar-link"
            href="/diagnostico"
            data-page="Diagnóstico"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7 3h8l3 3v15H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"
              />
              <path d="M15 3v4h4M9 12h6M9 16h6" />
            </svg>

            <span>Diagnóstico</span>
          </a>

          <a
            class="sidebar-link"
            href="/resultados"
            data-page="Resultados"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 20V10M12 20V4M19 20v-7" />
            </svg>

            <span>Resultados</span>
          </a>

          <a
            class="sidebar-link"
            href="/painel#rota-sustentavel"
            data-page="Ruta Sostenible"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7 20a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM17 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"
              />
              <path
                d="M10.5 15.5c1.4-.5 2.6-1.5 3.4-3M7 12V8M17 16v4"
              />
            </svg>

            <span>Ruta Sostenible</span>
          </a>

          <a
            class="sidebar-link is-active"
            href="/pontos"
            data-page="Puntos de Recogida"
            aria-current="page"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"
              />
              <circle cx="12" cy="9" r="2.5" />
            </svg>

            <span>Puntos de Recogida</span>
          </a>
        </nav>

        <div class="sidebar-botanical" aria-hidden="true"></div>

        <a
          class="sidebar-link sidebar-help"
          href="/painel#ajuda"
          data-page="Ayuda"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path
              d="M9.5 9a2.6 2.6 0 1 1 4.1 2.1c-1.2.8-1.6 1.3-1.6 2.4M12 17h.01"
            />
          </svg>

          <span>Ayuda</span>
        </a>
      </aside>

      <main
        class="app-workspace"
        aria-label="Área de puntos de recogida"
      >
        <header class="workspace-header">
          <button
            class="theme-toggle language-toggle"
            type="button"
            data-language-toggle
            aria-label="Mudar para português"
            title="Mudar para português"
          >
            <span data-language-toggle-label>PT</span>
          </button>
          <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-pressed="true"
            aria-label="Activar tema claro"
          >
            <svg
              class="theme-toggle__moon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"
              />
            </svg>

            <svg
              class="theme-toggle__sun"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
              />
            </svg>

            <span data-theme-toggle-label>Tema claro</span>
          </button>

          <div class="company-menu">
            <a
              class="company-menu__trigger company-menu__profile-link"
              href="/painel#perfil-empresa"
              aria-label="Editar información de la empresa"
            >
              <span class="company-avatar" aria-hidden="true">
                <svg viewBox="0 0 48 48">
                  <circle cx="24" cy="24" r="24" />
                  <path d="M15 32V20l7-5v17m0-11 7-4v15m-14 0h18" />
                  <path d="M31 13c2.2 0 4 1.8 4 4-2.2 0-4-1.8-4-4Z" />
                </svg>
              </span>

              <span class="company-menu__text">
                <span class="company-menu__name">
                  {{ empresa }}
                </span>

                <span class="company-menu__label">
                  Mi empresa
                </span>
              </span>
            </a>

            <button
              class="company-menu__menu-trigger"
              type="button"
              aria-label="Abrir menú de la cuenta"
              aria-expanded="false"
              aria-controls="company-menu-panel"
            >
              <svg
                class="company-menu__chevron"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="m7 10 5 5 5-5" />
              </svg>
            </button>

            <div
              class="company-menu__panel"
              id="company-menu-panel"
              hidden
            >
              <form action="/logout" method="post">
                <button
                  class="company-menu__logout"
                  type="submit"
                >
                  Cerrar sesión
                </button>
              </form>
            </div>
          </div>
        </header>


        <section
          class="company-profile-page"
          aria-labelledby="collection-points-title"
        >
          <div class="company-profile-heading">
            <p class="dashboard-kicker">
              Gestión de residuos
            </p>

            <h1 id="collection-points-title">
              Puntos de Recogida
            </h1>

            <p>
              Encuentra lugares adecuados para entregar residuos
              reciclables y otros materiales.
            </p>
          </div>

          <section
            class="company-overview-card"
            aria-labelledby="collection-points-content-title"
          >
            <div class="company-overview-card__heading">
              <div>
                <p class="quiz-panel__eyebrow">
                  Localización
                </p>

                <h2 id="collection-points-content-title">
                  Puntos disponibles
                </h2>
              </div>
            </div>

            <p>

            </p>
 
            <div
              data-collection-points
              aria-live="polite"
            ></div>
          </section>
        </section>
      </main>
    </div>
  </body>
</html>
