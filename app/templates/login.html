<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Acesso ao sistema EcoAvanza" />
    <title>Entrar | EcoAvanza</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='images/favicon.svg') }}" />
    <script src="{{ url_for('static', path='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}" />
    <script src="{{ url_for('static', path='js/login.js') }}" defer></script>
  </head>
  <body class="login-page">
    <button class="theme-toggle theme-toggle--floating" type="button" data-theme-toggle aria-pressed="true" aria-label="Ativar tema claro">
      <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z" />
      </svg>
      <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
      </svg>
      <span data-theme-toggle-label>Tema claro</span>
    </button>
    <main class="login-shell">
      <section class="login-visual" aria-hidden="true">
        <div class="login-visual__shade"></div>
      </section>

      <section class="login-content" aria-labelledby="login-title">
        <div class="login-card">
          <header class="brand" aria-label="EcoAvanza">
            <img
              class="brand__logo"
              src="{{ url_for('static', path='images/logo-ecoavanza.png') }}"
              alt="EcoAvanza — Pequenas ações, grandes cambios"
            />
          </header>

          <div class="login-heading">
            <h1 id="login-title">Accede a tu cuenta</h1>
            <p>Inicie sesión para continuar en el panel de administración.</p>
          </div>

          <form class="login-form" action="/login" method="post" novalidate>
            <div class="field">
              <label for="email">E-mail</label>
              <div class="field__control">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 8a7 7 0 0 0-14 0" />
                </svg>
                <input
                  id="email"
                  name="email"
                  type="email"
                  value="{{ email }}"
                  placeholder="empresa@email.com"
                  autocomplete="email"
                  autocapitalize="none"
                  spellcheck="false"
                  required
                  autofocus
                />
              </div>
            </div>

            <div class="field">
              <label for="senha">Contraseña</label>
              <div class="field__control">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input
                  id="senha"
                  name="senha"
                  type="password"
                  autocomplete="current-password"
                  required
                />
                <button
                  class="password-toggle"
                  type="button"
                  aria-label="Mostrar senha"
                  aria-controls="senha"
                  aria-pressed="false"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                    <circle cx="12" cy="12" r="2.5" />
                  </svg>
                </button>
              </div>
            </div>

            <p class="form-error" role="alert">{{ erro or "" }}</p>

            <button class="primary-button" type="submit">Entrar</button>
          </form>
          <p class="account-link">
            Ainda não tem uma conta?
            <a href="/cadastro">Criar conta</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
