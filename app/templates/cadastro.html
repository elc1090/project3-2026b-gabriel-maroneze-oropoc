<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Crie uma conta EcoAvanza" />
    <title>Criar conta | EcoAvanza</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='images/favicon.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}" />
    <script src="{{ url_for('static', path='js/login.js') }}" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-visual" aria-hidden="true">
        <div class="login-visual__shade"></div>
      </section>

      <section class="login-content" aria-labelledby="signup-title">
        <div class="login-card">
          <header class="brand" aria-label="EcoAvanza">
            <img
              class="brand__logo"
              src="{{ url_for('static', path='images/logo-ecoavanza.png') }}"
              alt="EcoAvanza"
            />
          </header>

          <div class="login-heading">
            <h1 id="signup-title">Criar conta</h1>
            <p>Cadastre seu e-mail e uma senha para acessar o EcoAvanza.</p>
          </div>

          <form class="login-form" action="/cadastro" method="post">
            <div class="field">
              <label for="email">E-mail</label>
              <div class="field__control">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 6h16v12H4z" />
                  <path d="m4 7 8 6 8-6" />
                </svg>
                <input
                  id="email"
                  name="email"
                  type="email"
                  value="{{ email }}"
                  placeholder="empresa@email.com"
                  autocomplete="email"
                  autocapitalize="none"
                  spellcheck="false"
                  maxlength="254"
                  required
                  autofocus
                />
              </div>
            </div>

            <div class="field">
              <label for="senha">Senha</label>
              <div class="field__control">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                </svg>
                <input
                  id="senha"
                  name="senha"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />
                <button
                  class="password-toggle"
                  type="button"
                  aria-label="Mostrar senha"
                  aria-controls="senha"
                  aria-pressed="false"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />
                    <circle cx="12" cy="12" r="2.5" />
                  </svg>
                </button>
              </div>
              <small class="field-hint">Use pelo menos 8 caracteres.</small>
            </div>

            <p class="form-error" role="alert">{{ erro or "" }}</p>
            <button class="primary-button" type="submit">Criar conta</button>
          </form>

          <p class="account-link">
            Já tem uma conta?
            <a href="/">Entrar</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
